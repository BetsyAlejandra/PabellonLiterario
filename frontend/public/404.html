<!DOCTYPE html>
<html lang="es">

  <style>

      color: #e0c5a7;

      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;

    h1 {

      max-width: 600px;
    }

      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;

    a:hover {
      background: linear-gradient(45deg, #845ec2, #d65db1);
    }
